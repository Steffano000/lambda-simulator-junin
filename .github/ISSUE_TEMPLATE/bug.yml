name: Bug
description: Algo no funciona como indican los docs
labels: ['bug']
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Preset / tamaño de grilla / escenario
        2. Acción
        3. Resultado
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador y SO
